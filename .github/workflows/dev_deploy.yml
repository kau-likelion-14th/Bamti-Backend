name: LTE Dev CI/CD

on:
  pull_request:
    types:
      - closed
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    if: (github.event_name == 'pull_request' &&
      github.event.pull_request.merged == true &&
      github.event.pull_request.base.ref == 'main')
      || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create .env file from secret
        run: |
          printf '%s' "${{secrets.LTE_ENV}}" > .env
          chmod 600 .env

      - name: Set up JDK 21
        uses: actions/setup-java@v4.0.0
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
        shell: bash

      - name: Build with Gradle
        run: ./gradlew clean build -x test
        shell: bash

      - name: Get current time
        uses: jobStorer/get-current-time@v2
        id: current-time
        with:
          format: 'YYYYMMDD-HHmmss'
          utcOffset: '+09:00'

      - name: Show current time
        uses: echo "${{ steps.current-time.outputs.formattedTime }}"
        shell: bash

      - name: Generate deployment package
        run: |
          
          mkdir -p deploy
          cp build/libs/*.jar deploy/application.jar
          cp Procfile deploy/Profile
          cp .env deploy/.env
          cp -r .ebextensions_dev deploy/.ebextensions
          cp -r .platform deploy/.platform
          
          cd deploy && zip -r deploy.zip

      - name: Verify deploy zip content
        run: |
          unzip -l deploy/deploy.zip | head -n 50
          
          unzip -l deploy/deploy.zip | egrep -i "pom.xml|Buildfile|src/|repository/"
          && exit 1 || echo "OK: no sample source"

      - name: Deploy to Elastic Beanstalk
        uses: einaregilsson/beanstalk-deploy@v20
        with:
          aws_access_key: ${{secrets.AWS_ACTION_ACCESS_KEY_ID}}
          aws_secret_key: ${{secrets.AWS_ACTION_SECRET_ACCESS_KEY}}

          application_name: 'lte-dev'
          version_description: github-actions-${{steps.current-time.outputs.formattedTime}}
          region: "ap-northeast-2"

          deployment_package: 'deploy/deploy.zip'
          wait_for_deployment: true
          version_label: ''
