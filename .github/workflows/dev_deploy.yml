name: LTE Dev CI/CD

on:
  pull_request:
    types: [closed]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    if: >-
      (github.event_name == 'pull_request' &&
       github.event.pull_request.merged == true &&
       github.event.pull_request.base.ref == 'main')
      || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create .env file from secret
        env:
          LTE_ENV: ${{ secrets.LTE_ENV }}
        run: |
          printf '%s' "$LTE_ENV" > .env
          chmod 600 .env

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew clean build -x test

      - name: Get current time
        uses: josStorer/get-current-time@v2
        id: current-time
        with:
          format: 'YYYYMMDD-HHmmss'
          utcOffset: '+09:00'

      - name: Show current time
        run: echo "${{ steps.current-time.outputs.formattedTime }}"

      - name: Generate deployment package
        run: |
          mkdir -p deploy
          cp "$(ls build/libs/*.jar | grep -v plain)" deploy/application.jar
          cp Procfile deploy/Procfile
          cp .env deploy/.env
          cp -r .ebextensions_dev deploy/.ebextensions
          cp -r .platform deploy/.platform
          cd deploy && zip -r deploy.zip .

      - name: Verify deploy zip content
        run: |
          unzip -l deploy/deploy.zip | head -n 50
          if unzip -l deploy/deploy.zip | grep -Eiq "pom.xml|Buildfile|src/|repository/"; then
            echo "Sample source detected"; exit 1
          fi
          echo "OK: no sample source"

      - name: Deploy to Elastic Beanstalk
        uses: einaregilsson/beanstalk-deploy@v22
        with:
          aws_access_key: ${{ secrets.AWS_ACTION_ACCESS_KEY_ID }}
          aws_secret_key: ${{ secrets.AWS_ACTION_SECRET_ACCESS_KEY }}
          application_name: lte-dev
          environment_name: lte-dev-env   # ← EB 콘솔에 있는 실제 환경 이름으로 바꿔
          version_label: github-action-${{ steps.current-time.outputs.formattedTime }}
          version_description: ${{ github.sha }}
          region: ap-northeast-2
          deployment_package: deploy/deploy.zip
          wait_for_deployment: true